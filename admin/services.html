<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Services — Sole Craft Admin</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- Tailwind CSS CDN + Custom Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: '#D4AF37',
            'gold-hover': '#AA882C',
            cognac: '#8C6239',
            tan: '#B5835A',
            'text-primary': 'var(--text-primary)',
            'text-secondary': 'var(--text-secondary)',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#FAF7F0] text-[#1C1C1C] dark:bg-[#0F0F0F] dark:text-[#F3ECE0] transition-colors duration-500 min-h-screen flex flex-col lg:flex-row">

  <!-- Admin Sidebar -->
  <aside class="w-full lg:w-64 bg-[#171717] text-[#FAF7F0] border-r border-gray-800 flex flex-col justify-between p-6">
    <div class="space-y-8">
      <a href="../index.html" class="flex items-center gap-2">
        <i class="bi bi-gem text-gold text-xl"></i>
        <span class="font-serif text-xl font-bold tracking-wider text-gold-gradient">SOLE CRAFT</span>
      </a>

      <nav class="space-y-2 text-xs font-bold uppercase tracking-wider">
        <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-400 hover:text-white transition">
          <i class="bi bi-speedometer2 text-lg"></i> Dashboard
        </a>
        <a href="bookings.html" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-400 hover:text-white transition">
          <i class="bi bi-ticket-detailed text-lg"></i> Bookings
        </a>
        <a href="users.html" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-400 hover:text-white transition">
          <i class="bi bi-people text-lg"></i> Customers
        </a>
        <a href="services.html" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-gold text-black transition">
          <i class="bi bi-gear text-lg"></i> Services
        </a>
        <a href="messages.html" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-400 hover:text-white transition">
          <i class="bi bi-chat-left-text text-lg"></i> Messages
        </a>
        <a href="analytics.html" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-400 hover:text-white transition">
          <i class="bi bi-graph-up-arrow text-lg"></i> Analytics
        </a>
      </nav>
    </div>

    <div class="border-t border-gray-800 pt-4 mt-8 flex justify-between items-center text-xs text-gray-400">
      <div>
        <span class="block text-[10px] text-gray-500 uppercase">Logged as</span>
        <span class="font-semibold text-gold">Admin Atelier</span>
      </div>
      <button onclick="handleAdminLogout()" class="text-red-500 hover:text-red-400 text-lg" title="Log out"><i class="bi bi-box-arrow-right"></i></button>
    </div>
  </aside>

  <!-- Mobile Header -->
  <header class="lg:hidden bg-[#171717] text-[#FAF7F0] p-4 flex justify-between items-center border-b border-gray-800">
    <a href="../index.html" class="flex items-center gap-2">
      <i class="bi bi-gem text-gold text-lg"></i>
      <span class="font-serif text-lg font-bold text-gold-gradient">SOLE CRAFT</span>
    </a>
    <button onclick="handleAdminLogout()" class="text-red-500"><i class="bi bi-box-arrow-right"></i></button>
  </header>

  <!-- Main section -->
  <main class="flex-grow p-6 lg:p-10 space-y-8 overflow-y-auto">
    
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-serif font-bold text-text-primary">Manage Services</h1>
        <p class="text-xs text-text-secondary">Edit base fees, turnaround times, and descriptions of the shoe repair menu</p>
      </div>
      
      <button id="add-service-btn" class="bg-gold hover:bg-gold-hover text-black px-5 py-2.5 rounded-full text-xs font-bold uppercase tracking-wider transition shadow flex items-center gap-2">
        <i class="bi bi-plus-circle"></i> Add Service
      </button>
    </div>

    <!-- Table of services -->
    <div class="glass-panel p-6 rounded-2xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead>
            <tr class="border-b border-gray-200 dark:border-gray-800 pb-2 text-[10px] text-gray-500 uppercase tracking-widest">
              <th class="py-3 px-4">Service Program</th>
              <th class="py-3 px-4">Description</th>
              <th class="py-3 px-4">Est Turnaround</th>
              <th class="py-3 px-4">Starting Fee</th>
              <th class="py-3 px-4">Actions</th>
            </tr>
          </thead>
          <tbody id="admin-services-tbody">
            <!-- JS Injects dynamic catalog row items -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Service CRUD Modal container -->
  <div id="service-crud-modal" class="hidden fixed inset-0 z-[9999] bg-black bg-opacity-70 backdrop-blur-md items-center justify-center p-4">
    <div class="glass-panel w-full max-w-md rounded-2xl shadow-2xl p-6 relative">
      <h3 id="service-modal-title" class="text-2xl font-serif font-bold text-text-primary mb-4">Add New Service</h3>
      <button onclick="closeCustomModal('service-crud-modal')" class="absolute top-4 right-4 text-gray-500 hover:text-text-primary"><i class="bi bi-x-lg text-xl"></i></button>
      
      <form id="service-crud-form" class="space-y-4">
        <input type="hidden" id="service-id-hidden">
        
        <div>
          <label class="block text-xs uppercase font-bold text-text-secondary mb-1">Service Name</label>
          <input type="text" id="service-name-input" class="w-full bg-[#FAF7F0] dark:bg-[#171717] border border-gold/10 rounded-lg py-2.5 px-4 text-xs text-text-primary focus:outline-none focus:border-gold" required>
        </div>
        <div>
          <label class="block text-xs uppercase font-bold text-text-secondary mb-1">Description</label>
          <input type="text" id="service-desc-input" class="w-full bg-[#FAF7F0] dark:bg-[#171717] border border-gold/10 rounded-lg py-2.5 px-4 text-xs text-text-primary focus:outline-none focus:border-gold" required>
        </div>
        <div>
          <label class="block text-xs uppercase font-bold text-text-secondary mb-1">Starting Price (INR)</label>
          <input type="number" id="service-price-input" class="w-full bg-[#FAF7F0] dark:bg-[#171717] border border-gold/10 rounded-lg py-2.5 px-4 text-xs text-text-primary focus:outline-none focus:border-gold" required>
        </div>
        <div>
          <label class="block text-xs uppercase font-bold text-text-secondary mb-1">Average Turnaround</label>
          <input type="text" id="service-time-input" class="w-full bg-[#FAF7F0] dark:bg-[#171717] border border-gold/10 rounded-lg py-2.5 px-4 text-xs text-text-primary focus:outline-none focus:border-gold" required>
        </div>
        <div>
          <label class="block text-xs uppercase font-bold text-text-secondary mb-1">Bootstrap Icon Class</label>
          <input type="text" id="service-icon-input" class="w-full bg-[#FAF7F0] dark:bg-[#171717] border border-gold/10 rounded-lg py-2.5 px-4 text-xs text-text-primary focus:outline-none focus:border-gold" required>
        </div>
        <button type="submit" class="w-full bg-gold hover:bg-gold-hover text-black py-2.5 rounded-full text-xs font-bold uppercase tracking-wider transition mt-4">
          Save Program
        </button>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/admin.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Security Check: is admin logged in?
      const loggedUser = localStorage.getItem('sc_logged_in_user');
      if (loggedUser !== 'admin@example.com') {
        window.location.href = '../login.html';
        return;
      }
    });

    window.handleAdminLogout = function() {
      localStorage.removeItem('sc_logged_in_user');
      showToast('Logged out of Admin Portal.', 'info');
      setTimeout(() => {
        window.location.href = '../login.html';
      }, 1000);
    }
  </script>
</body>
</html>
