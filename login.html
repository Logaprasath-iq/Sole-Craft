<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sole Craft</title>
  <meta name="description" content="Access your Sole Craft Shoe Repair account. Monitor repair timelines, manage pickup addresses, or review payment receipts.">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/png" href="assets/icons/favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- Tailwind CSS CDN + Custom Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: 'var(--color-gold)',
            'gold-hover': 'var(--color-gold-hover)',
            cognac: '#8C6239',
            tan: '#B5835A',
            'text-primary': 'var(--text-primary)',
            'text-secondary': 'var(--text-secondary)',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#FAF7F0] text-[#1C1C1C] dark:bg-[#0F0F0F] dark:text-[#F3ECE0] transition-colors duration-500 min-h-screen flex flex-col justify-between relative">

  <!-- Loader Overlay -->
  <div id="page-loader">
    <div class="loader-shoe mb-4"></div>
    <div class="text-gold font-serif text-lg tracking-widest animate-pulse">SOLE CRAFT</div>
  </div>

  <!-- Premium Sticky Header Navbar (Minimal for Login/Signup) -->
  <header class="fixed top-0 left-0 w-full z-50 py-3 lg:py-5 transition-all duration-300 bg-transparent">
    <div class="container mx-auto px-6 flex justify-between items-center">
      <!-- Logo -->
      <a href="index.html" class="flex items-center gap-2">
        <img src="assets/images/logo.png" alt="Sole Craft Logo" class="w-8 h-8 rounded-full border border-gold/30 object-cover">
        <span class="font-serif text-2xl font-bold tracking-wider text-gold-gradient">SOLE CRAFT</span>
      </a>

      <!-- Right Action Items (Minimal: Only Theme Toggle and RTL/Language Toggle) -->
      <div class="flex items-center gap-4">
        <!-- Theme Toggle Circular Button -->
        <button id="theme-toggle" class="theme-circle-btn">
          <i class="bi bi-sun-fill text-lg"></i>
        </button>
        <!-- Language/RTL Toggle Pill Button -->
        <button id="lang-toggle" class="rtl-toggle-pill">
          <i class="bi bi-arrow-left-right text-xs"></i>
          <span id="lang-text">RTL</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Login Main Content Card -->
  <main class="flex-grow pt-32 pb-16 flex items-center justify-center relative z-10">
    <div class="container mx-auto px-6 max-w-md relative page-transition">
      <div class="glass-panel p-8 rounded-3xl border border-gold/15 shadow-2xl">
        <div class="text-center mb-8">
          <a href="index.html" class="inline-flex items-center gap-2 mb-3">
            <i class="bi bi-gem text-gold text-2xl"></i>
            <span class="font-serif text-2xl font-bold tracking-wider text-gold-gradient">SOLE CRAFT</span>
          </a>
          <h2 class="text-2xl font-serif font-bold text-text-primary">Welcome Back</h2>
          <p class="text-xs text-text-secondary">Access your shoe restoration dashboard</p>
        </div>

        <form id="login-form" class="space-y-6">
          <div>
            <label class="block text-xs uppercase font-bold text-text-secondary mb-2">Email Address</label>
            <input type="email" id="login-email" class="w-full bg-[#FAF7F0] dark:bg-[#171717] border border-gold/10 rounded-lg py-3 px-4 text-sm text-text-primary focus:outline-none focus:border-gold" placeholder="user@example.com or admin@example.com" required>
          </div>

          <div>
            <div class="flex justify-between items-center mb-2">
              <label class="block text-xs uppercase font-bold text-text-secondary">Password</label>
              <a href="coming-soon.html" class="text-[10px] text-gold hover:underline">Forgot Password?</a>
            </div>
            <input type="password" id="login-password" class="w-full bg-[#FAF7F0] dark:bg-[#171717] border border-gold/10 rounded-lg py-3 px-4 text-sm text-text-primary focus:outline-none focus:border-gold" placeholder="password or admin" required>
          </div>

          <div class="flex items-center">
            <input type="checkbox" id="remember-me" class="rounded border-gray-300 text-gold focus:ring-gold h-4 w-4">
            <label for="remember-me" class="ml-2 text-xs text-text-secondary cursor-pointer">Remember my session</label>
          </div>

          <button type="submit" class="w-full bg-gold hover:bg-gold-hover text-black py-3 rounded-full text-xs font-bold uppercase tracking-wider transition shadow-md">
            Sign In
          </button>
        </form>

        <!-- Social Logins -->
        <div class="mt-8 border-t border-gray-200 dark:border-gray-800 pt-6 text-center">
          <span class="text-[10px] text-gray-500 uppercase tracking-widest block mb-4">Or Login With</span>
          <div class="flex gap-4 justify-center">
            <button onclick="showToast('Google login simulated!', 'success')" class="flex-1 flex items-center justify-center gap-2 border border-gray-300 dark:border-gray-700 py-2 rounded-lg text-xs hover:border-gold transition"><i class="bi bi-google"></i> Google</button>
            <button onclick="showToast('Apple login simulated!', 'success')" class="flex-1 flex items-center justify-center gap-2 border border-gray-300 dark:border-gray-700 py-2 rounded-lg text-xs hover:border-gold transition"><i class="bi bi-apple"></i> Apple</button>
          </div>
        </div>

        <!-- Register prompt -->
        <div class="text-center mt-6 text-xs text-text-secondary">
          Don't have an account? <a href="register.html" class="text-gold hover:underline">Register now</a>
        </div>
      </div>
    </div>
  </main>

  

  <!-- Scripts -->
  <script src="assets/js/main.js"></script>
</body>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('login-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const email = document.getElementById('login-email').value.trim();
          const password = document.getElementById('login-password').value.trim();

          // Check if admin credentials
          if (email === 'admin@example.com' && password === 'admin') {
            localStorage.setItem('sc_logged_in_user', email);
            showToast('Welcome, Administrator!', 'success');
            setTimeout(() => {
              window.location.href = 'admin/index.html';
            }, 1000);
            return;
          }

          // Check local storage users database
          const users = JSON.parse(localStorage.getItem('sc_users')) || [];
          const user = users.find(u => u.email === email && u.password === password);

          if (user) {
            localStorage.setItem('sc_logged_in_user', email);
            showToast(`Welcome back, ${user.name}!`, 'success');
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 1000);
          } else {
            showToast('Invalid email or password credentials.', 'error');
          }
        });
      }
    });
  </script>
</body>
</html>
