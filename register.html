<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Sole Craft</title>
  <meta name="description" content="Create a Sole Craft account to unlock customized shoe repair updates, pick-up scheduling, and favorites list persistence.">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/png" href="assets/icons/favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- Tailwind CSS CDN + Custom Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: 'var(--color-gold)',
            'gold-hover': 'var(--color-gold-hover)',
            cognac: '#8C6239',
            tan: '#B5835A',
            'text-primary': 'var(--text-primary)',
            'text-secondary': 'var(--text-secondary)',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#FAF7F0] text-[#1C1C1C] dark:bg-[#0F0F0F] dark:text-[#F3ECE0] transition-colors duration-500 min-h-screen flex flex-col justify-between relative">

  <!-- Loader Overlay -->
  <div id="page-loader">
    <div class="loader-shoe mb-4"></div>
    <div class="text-gold font-serif text-lg tracking-widest animate-pulse">SOLE CRAFT</div>
  </div>

  <!-- Premium Sticky Header Navbar (Minimal for Login/Signup) -->
  <header class="fixed top-0 left-0 w-full z-50 py-3 lg:py-5 transition-all duration-300 bg-transparent">
    <div class="container mx-auto px-6 flex justify-between items-center">
      <!-- Logo -->
      <a href="index.html" class="flex items-center gap-2">
        <img src="assets/images/logo.png" alt="Sole Craft Logo" class="w-8 h-8 rounded-full border border-gold/30 object-cover">
        <span class="font-serif text-2xl font-bold tracking-wider text-gold-gradient">SOLE CRAFT</span>
      </a>

      <!-- Right Action Items (Minimal: Only Theme Toggle and RTL/Language Toggle) -->
      <div class="flex items-center gap-4">
        <!-- Theme Toggle Circular Button -->
        <button id="theme-toggle" class="theme-circle-btn">
          <i class="bi bi-sun-fill text-lg"></i>
        </button>
        <!-- Language/RTL Toggle Pill Button -->
        <button id="lang-toggle" class="rtl-toggle-pill">
          <i class="bi bi-arrow-left-right text-xs"></i>
          <span id="lang-text">RTL</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Register Main Content Card -->
  <main class="flex-grow pt-32 pb-16 flex items-center justify-center relative z-10">
    <div class="container mx-auto px-6 max-w-md relative page-transition">
      <div class="glass-panel p-8 rounded-3xl border border-gold/15 shadow-2xl">
        <div class="text-center mb-8">
          <a href="index.html" class="inline-flex items-center gap-2 mb-3">
            <i class="bi bi-gem text-gold text-2xl"></i>
            <span class="font-serif text-2xl font-bold tracking-wider text-gold-gradient">SOLE CRAFT</span>
          </a>
          <h2 class="text-2xl font-serif font-bold text-text-primary">Create Account</h2>
          <p class="text-xs text-text-secondary">Register to start managing shoe repairs</p>
        </div>

        <form id="register-form" class="space-y-4">
          <div>
            <label class="block text-xs uppercase font-bold text-text-secondary mb-1">Full Name</label>
            <input type="text" id="reg-name" class="w-full bg-[#FAF7F0] dark:bg-[#171717] border border-gold/10 rounded-lg py-2.5 px-4 text-xs text-text-primary focus:outline-none focus:border-gold" placeholder="John Doe" required>
          </div>

          <div>
            <label class="block text-xs uppercase font-bold text-text-secondary mb-1">Email Address</label>
            <input type="email" id="reg-email" class="w-full bg-[#FAF7F0] dark:bg-[#171717] border border-gold/10 rounded-lg py-2.5 px-4 text-xs text-text-primary focus:outline-none focus:border-gold" placeholder="john@example.com" required>
          </div>

          <div>
            <label class="block text-xs uppercase font-bold text-text-secondary mb-1">Phone Number</label>
            <input type="tel" id="reg-phone" class="w-full bg-[#FAF7F0] dark:bg-[#171717] border border-gold/10 rounded-lg py-2.5 px-4 text-xs text-text-primary focus:outline-none focus:border-gold" placeholder="9876543210" required>
          </div>

          <div>
            <label class="block text-xs uppercase font-bold text-text-secondary mb-1">Password</label>
            <input type="password" id="reg-password" class="w-full bg-[#FAF7F0] dark:bg-[#171717] border border-gold/10 rounded-lg py-2.5 px-4 text-xs text-text-primary focus:outline-none focus:border-gold" placeholder="Minimum 6 characters" required>
          </div>

          <div>
            <label class="block text-xs uppercase font-bold text-text-secondary mb-1">Confirm Password</label>
            <input type="password" id="reg-confirm-password" class="w-full bg-[#FAF7F0] dark:bg-[#171717] border border-gold/10 rounded-lg py-2.5 px-4 text-xs text-text-primary focus:outline-none focus:border-gold" required>
          </div>

          <button type="submit" class="w-full bg-gold hover:bg-gold-hover text-black py-3 rounded-full text-xs font-bold uppercase tracking-wider transition shadow-md mt-6">
            Register
          </button>
        </form>

        <!-- Log in redirect -->
        <div class="text-center mt-6 text-xs text-text-secondary">
          Already have an account? <a href="login.html" class="text-gold hover:underline">Log in</a>
        </div>
      </div>
    </div>
  </main>

  

  <!-- Scripts -->
  <script src="assets/js/main.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('register-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const name = document.getElementById('reg-name').value.trim();
          const email = document.getElementById('reg-email').value.trim();
          const phone = document.getElementById('reg-phone').value.trim();
          const password = document.getElementById('reg-password').value.trim();
          const confirm = document.getElementById('reg-confirm-password').value.trim();

          if (password.length < 6) {
            showToast('Password must be at least 6 characters.', 'error');
            return;
          }

          if (password !== confirm) {
            showToast('Passwords do not match.', 'error');
            return;
          }

          // Check for duplicate account
          let users = JSON.parse(localStorage.getItem('sc_users')) || [];
          const exists = users.some(u => u.email === email);

          if (exists) {
            showToast('An account with this email already exists.', 'error');
            return;
          }

          // Register user
          const newUser = {
            email,
            name,
            phone,
            password,
            date: new Date().toISOString().split('T')[0]
          };

          users.push(newUser);
          localStorage.setItem('sc_users', JSON.stringify(users));
          localStorage.setItem('sc_logged_in_user', email);

          showToast('Account created successfully!', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1000);
        });
      }
    });
  </script>
</body>
</html>
