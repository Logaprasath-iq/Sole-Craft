<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <!-- Theme Initializer Script -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('soleCraftTheme') || 'dark';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Maintenance — Sole Craft</title>
  <meta name="description" content="Sole Craft is undergoing scheduled upgrades to restore booking services. Back online shortly.">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/png" href="assets/icons/favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- Tailwind CSS CDN + Custom Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: 'var(--color-gold)',
            'gold-hover': 'var(--color-gold-hover)',
            cognac: 'var(--color-cognac)',
            tan: 'var(--color-tan)',
            'text-primary': 'var(--text-primary)',
            'text-secondary': 'var(--text-secondary)',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#FAF7F0] text-[#1C1C1C] dark:bg-[#0F0F0F] dark:text-[#F3ECE0] transition-colors duration-500 min-h-screen flex items-center justify-center relative text-center py-20 bg-cover bg-center" style="background-image: url('assets/images/leather_bg.jpg');">
  <div class="absolute inset-0 bg-black/85 pointer-events-none"></div>

  

  <div class="container mx-auto px-6 max-w-lg relative z-10 page-transition">
    
    <div class="glass-panel p-10 rounded-3xl border border-gold/15 shadow-2xl space-y-8">
      
      <!-- Brand Logo -->
      <a href="index.html" class="inline-flex items-center gap-2 mb-2">
        <img src="assets/images/logo.png" alt="Sole Craft Logo" class="w-8 h-8 rounded-full border border-gold/30 object-cover">
        <span class="font-serif text-2xl font-bold tracking-wider text-gold-gradient">SOLE CRAFT</span>
      </a>

      <div>
        <div class="w-16 h-16 rounded-full bg-gold/10 flex items-center justify-center text-gold mx-auto mb-4 border border-gold/20">
          <i class="bi bi-tools text-2xl"></i>
        </div>
        <h1 class="text-3xl font-serif font-bold text-white">Scheduled Maintenance</h1>
        <p class="text-xs text-gray-300 mt-2 leading-relaxed">
          Our digital booking systems are currently receiving a fresh leather conditioning and tune-up. We'll be back online shortly.
        </p>
      </div>

      <!-- Countdown Timer Widget -->
      <div class="grid grid-cols-4 gap-4 text-center">
        <div class="glass-panel p-3.5 rounded-xl border border-gold/10">
          <strong class="text-2xl font-serif text-gold block" id="cd-days">00</strong>
          <span class="text-[9px] uppercase text-gray-400">Days</span>
        </div>
        <div class="glass-panel p-3.5 rounded-xl border border-gold/10">
          <strong class="text-2xl font-serif text-gold block" id="cd-hours">04</strong>
          <span class="text-[9px] uppercase text-gray-400">Hours</span>
        </div>
        <div class="glass-panel p-3.5 rounded-xl border border-gold/10">
          <strong class="text-2xl font-serif text-gold block" id="cd-minutes">12</strong>
          <span class="text-[9px] uppercase text-gray-400">Min</span>
        </div>
        <div class="glass-panel p-3.5 rounded-xl border border-gold/10">
          <strong class="text-2xl font-serif text-gold block" id="cd-seconds">00</strong>
          <span class="text-[9px] uppercase text-gray-400">Sec</span>
        </div>
      </div>

      <!-- Status Alerts form -->
      <div class="space-y-4">
        <h4 class="font-serif text-base font-bold text-white">Get Status Alerts</h4>
        <form onsubmit="event.preventDefault(); showToast('Subscribed for Maintenance Alerts!', 'success'); this.reset();" class="flex gap-2">
          <input type="email" placeholder="Your Email Address" class="w-full bg-black/45 border border-gold/15 rounded-lg py-3 px-4 text-xs text-white focus:outline-none focus:border-gold" required>
          <button type="submit" class="bg-gold hover:bg-gold-hover text-black px-6 rounded-lg text-xs font-bold uppercase transition"><i class="bi bi-envelope mr-1"></i> Notify</button>
        </form>
      </div>

      <!-- Return Home Link -->
      <div class="flex justify-center gap-6 border-t border-gray-800 pt-6">
        <a href="index.html" class="text-xs text-gold hover:underline flex items-center gap-1"><i class="bi bi-arrow-left"></i> Return Home</a>
      </div>

    </div>

  </div>

  <!-- Scripts -->
  <script src="assets/js/main.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Countdown Timer simulation logic
      let days = 0, hours = 4, mins = 12, secs = 0;
      
      const interval = setInterval(() => {
        secs--;
        if (secs < 0) {
          secs = 59;
          mins--;
          if (mins < 0) {
            mins = 59;
            hours--;
            if (hours < 0) {
              clearInterval(interval);
              return;
            }
          }
        }
        
        document.getElementById('cd-days').innerText = String(days).padStart(2, '0');
        document.getElementById('cd-hours').innerText = String(hours).padStart(2, '0');
        document.getElementById('cd-minutes').innerText = String(mins).padStart(2, '0');
        document.getElementById('cd-seconds').innerText = String(secs).padStart(2, '0');
      }, 1000);
    });
  </script>
</body>
</html>
